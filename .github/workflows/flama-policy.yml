name: Flama Policy

on:
  pull_request:
    branches: [main]

permissions:
  checks: read
  contents: read

jobs:
  policy:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-policy.yml@e72d73ea4f6bcedb62b333026b2567bfc0cb4ef5
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      paperclip-app-slug: flama-delivery-maxbec
      platform-sha: e72d73ea4f6bcedb62b333026b2567bfc0cb4ef5
      profile: fast
