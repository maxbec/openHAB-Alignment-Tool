name: Flama Branch Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-guard:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-branch-guard.yml@e72d73ea4f6bcedb62b333026b2567bfc0cb4ef5
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      profile: fast
